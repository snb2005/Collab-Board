services:
  - type: web
    name: collab-board-backend
    env: docker
    rootDir: backend

    envVars:
      - key: MONGODB_URL
        sync: false

      - key: MONGODB_DATABASE
        value: collab_board

      - key: REDIS_URL
        sync: false

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: CORS_ORIGINS_RAW
        value: https://colaboard.netlify.app
